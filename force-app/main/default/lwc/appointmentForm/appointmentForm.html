<template>
    <lightning-card title="Book Appointment">
        
        <lightning-input label="Patient Id" onchange={handlePatient}></lightning-input>
        
        <lightning-input label="Doctor Id" onchange={handleDoctor}></lightning-input>
        
        <lightning-input type="date" label="Date" onchange={handleDate}></lightning-input>

         <lightning-input type="time"  label="Time Slot"  onchange={handleTime}></lightning-input>
        
     

        <lightning-button 
            label="Book Appointment" 
            onclick={createAppointment}>
        </lightning-button>

    </lightning-card>
</template>
